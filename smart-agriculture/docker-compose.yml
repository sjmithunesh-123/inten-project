version: '3.9'

services:
  backend:
    build:
      context: ./backend
    container_name: smart-agriculture-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: smart_agriculture_db
      DB_USER: root
      DB_PASSWORD: rootpass
    depends_on:
      - mysql
    volumes:
      - ./backend:/app
      - ./ml-models:/app/ml-models
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
    container_name: smart-agriculture-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0

  mysql:
    image: mysql:8.0
    container_name: smart-agriculture-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: smart_agriculture_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
