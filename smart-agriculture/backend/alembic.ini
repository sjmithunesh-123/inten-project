[alembic]
script_location = migrations
prepend_sys_path = .
; Set to your Postgres DATABASE_URL for Alembic migrations (e.g. Supabase connection string)
sqlalchemy.url = postgresql+psycopg2://user:pass@127.0.0.1:5432/smart_agriculture_db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
